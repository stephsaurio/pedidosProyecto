<div class="auth-page">

  <header class="auth-header">
    <a class="logo" href="/">PEDIDOS</a>
    <a class="volver" href="/">VOLVER A LA TIENDA</a>
  </header>

  <main class="auth-content">

    <section class="auth-box">

      <p class="auth-label">MI CUENTA</p>

      <h1>Iniciar sesión</h1>

      <p class="auth-description">
        Ingresa a tu cuenta para consultar productos y pedidos.
      </p>

      <form (ngSubmit)="iniciarSesion()">

        <div class="field">
          <label for="correo">Correo electrónico</label>

          <input
            id="correo"
            type="email"
            name="correo"
            [(ngModel)]="login.correo"
            placeholder="correo@ejemplo.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="field">
          <label for="contrasena">Contraseña</label>

          <input
            id="contrasena"
            type="password"
            name="contrasena"
            [(ngModel)]="login.contrasena"
            placeholder="Contraseña"
            autocomplete="current-password"
            required
          >
        </div>

        <button type="submit">
          INICIAR SESIÓN
        </button>

      </form>

      <p class="auth-link">
        ¿No tienes cuenta?
        <a href="/registro">Crear cuenta</a>
      </p>

    </section>

  </main>

</div>
