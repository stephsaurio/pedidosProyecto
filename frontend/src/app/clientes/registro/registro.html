<div class="auth-page">
  <header class="auth-header">
    <a class="logo" href="/">PEDIDOS</a>
    <a class="volver" href="/login">INICIAR SESIÓN</a>
  </header>

  <main class="auth-content">
    <section class="auth-box">
      <p class="auth-label">NUEVO CLIENTE</p>
      <h1>Crear cuenta</h1>

      <p class="auth-description">Regístrate para realizar pedidos en nuestra tienda.</p>

      <form (ngSubmit)="registrar()">
        <div class="field">
          <label for="nombreCompleto">Nombre completo</label>

          <input
            id="nombreCompleto"
            type="text"
            name="nombreCompleto"
            [(ngModel)]="cliente.nombreCompleto"
            placeholder="Nombre completo"
            required
          />
        </div>

        <div class="field">
          <label for="nombreUsuario">Nombre de usuario</label>

          <input
            id="nombreUsuario"
            type="text"
            name="nombreUsuario"
            [(ngModel)]="cliente.nombreUsuario"
            placeholder="Nombre de usuario"
            required
          />
        </div>

        <div class="field">
          <label for="correoElectronico">Correo electrónico</label>

          <input
            id="correoElectronico"
            type="email"
            name="correoElectronico"
            [(ngModel)]="cliente.correoElectronico"
            placeholder="correo@ejemplo.com"
            required
          />
        </div>

        <div class="field">
          <label for="telefono">Teléfono</label>

          <input
            id="telefono"
            type="number"
            name="telefono"
            [(ngModel)]="cliente.telefono"
            placeholder="Teléfono"
            required
          />
        </div>

        <div class="field">
          <label for="nit">NIT</label>

          <input
            id="nit"
            type="text"
            name="nit"
            [(ngModel)]="cliente.nit"
            placeholder="NIT"
            required
          />
        </div>

        <div class="field">
          <label for="password">Contraseña</label>

          <input
            id="password"
            type="password"
            name="password"
            [(ngModel)]="cliente.password"
            placeholder="Contraseña"
            required
          />
        </div>

        <button type="submit">CREAR CUENTA</button>
      </form>

      <p class="auth-link">
        ¿Ya tienes cuenta?
        <a href="/login">Iniciar sesión</a>
      </p>
    </section>
  </main>
</div>
